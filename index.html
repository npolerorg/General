<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dream Inn Hotel — Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{--bg-primary:#0a0e1a;--bg-secondary:#111827;--bg-card:rgba(17,24,39,0.8);--bg-glass:rgba(255,255,255,0.03);--border:rgba(255,255,255,0.06);--border-bright:rgba(255,255,255,0.12);--text-primary:#f1f5f9;--text-secondary:#94a3b8;--text-muted:#64748b;--accent-blue:#3b82f6;--accent-cyan:#06b6d4;--accent-purple:#8b5cf6;--accent-green:#10b981;--accent-orange:#f59e0b;--accent-red:#ef4444;--accent-pink:#ec4899;--glow-blue:rgba(59,130,246,0.3)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{font-family:'Inter',sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh}
body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 20% 0%,rgba(59,130,246,0.08) 0%,transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(139,92,246,0.06) 0%,transparent 60%),radial-gradient(ellipse at 50% 50%,rgba(6,182,212,0.03) 0%,transparent 70%);pointer-events:none;z-index:0}
#root{min-height:100vh;position:relative;z-index:1}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.2)}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:0.4}}
.card{background:var(--bg-card);backdrop-filter:blur(10px);border-radius:14px;border:1px solid var(--border);padding:20px;position:relative;transition:all 0.3s ease}
.card:hover{border-color:var(--border-bright);transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:0.72rem;font-weight:600;white-space:nowrap}
.badge-complete{background:rgba(16,185,129,0.15);color:#10b981;border:1px solid rgba(16,185,129,0.3)}
.badge-in-progress{background:rgba(245,158,11,0.15);color:#f59e0b;border:1px solid rgba(245,158,11,0.3)}
.badge-pending{background:rgba(100,116,139,0.15);color:#94a3b8;border:1px solid rgba(100,116,139,0.3)}
.badge-critical{background:rgba(239,68,68,0.15);color:#ef4444;border:1px solid rgba(239,68,68,0.3)}
.badge-high{background:rgba(245,158,11,0.15);color:#f59e0b;border:1px solid rgba(245,158,11,0.3)}
.badge-medium{background:rgba(59,130,246,0.15);color:#3b82f6;border:1px solid rgba(59,130,246,0.3)}
.badge-not-started{background:rgba(100,116,139,0.1);color:#64748b;border:1px solid rgba(100,116,139,0.2)}
.badge-current{background:rgba(6,182,212,0.15);color:#06b6d4;border:1px solid rgba(6,182,212,0.3)}
.topbar{background:rgba(10,14,26,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);color:#fff;padding:14px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar h1{font-size:1.25rem;font-weight:700;letter-spacing:-0.3px;background:linear-gradient(135deg,#ffffff,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topbar-sub{font-size:0.78rem;color:var(--text-muted);font-weight:400}
.topbar-right{display:flex;align-items:center;gap:16px;font-size:0.78rem;color:var(--text-secondary)}
.live-dot{width:8px;height:8px;border-radius:50%;background:#10b981;animation:pulseDot 2s ease-in-out infinite;display:inline-block}
.tab-bar{display:flex;gap:2px;padding:0 32px;background:rgba(17,24,39,0.6);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);overflow-x:auto;position:sticky;top:53px;z-index:99;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.15) transparent;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 32px,#000 calc(100% - 48px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 32px,#000 calc(100% - 48px),transparent 100%)}
.tab-bar::-webkit-scrollbar{height:4px}.tab-bar::-webkit-scrollbar-track{background:transparent}.tab-bar::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:4px}.tab-bar::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.3)}
.tab-btn{padding:12px 14px;font-size:0.75rem;font-weight:500;border:none;background:transparent;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all 0.2s;font-family:'Inter',sans-serif;position:relative}
.tab-btn:hover{color:var(--text-secondary)}
.tab-btn.active{color:var(--text-primary);font-weight:600}
.content{padding:24px 32px 48px;max-width:1400px;margin:0 auto;animation:fadeUp 0.4s ease}
.section-title{font-size:1.05rem;font-weight:700;margin-bottom:14px;color:var(--text-primary)}
.section-subtitle{font-size:0.82rem;color:var(--text-secondary);margin-bottom:18px}
.alert-box{padding:14px 18px;border-radius:12px;margin-bottom:18px;font-size:0.82rem;line-height:1.6;border-left:4px solid;background:rgba(17,24,39,0.6)}
.alert-box.critical{border-left-color:#ef4444;background:rgba(239,68,68,0.06)}
.alert-box.warning{border-left-color:#f59e0b;background:rgba(245,158,11,0.06)}
.alert-box.info{border-left-color:#3b82f6;background:rgba(59,130,246,0.06)}
.alert-box.success{border-left-color:#10b981;background:rgba(16,185,129,0.06)}
.alert-title{font-weight:700;margin-bottom:4px}
.data-table{width:100%;border-collapse:collapse;font-size:0.78rem}
.data-table th{text-align:left;padding:10px 12px;font-weight:600;color:var(--text-secondary);border-bottom:1px solid var(--border-bright);background:rgba(255,255,255,0.03);white-space:nowrap;text-transform:uppercase;font-size:0.7rem;letter-spacing:0.5px}
.data-table th.right,.data-table td.right{text-align:right}
.data-table td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--text-primary)}
.data-table tr:hover td{background:rgba(255,255,255,0.02)}
.data-table tr.total-row td{font-weight:700;border-top:1px solid var(--border-bright);background:rgba(255,255,255,0.03)}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.kpi-card{text-align:center;padding:16px 12px}
.kpi-label{font-size:0.68rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px;font-weight:500}
.kpi-value{font-size:1.4rem;font-weight:700;color:var(--text-primary)}
.kpi-sub{font-size:0.7rem;margin-top:4px;font-weight:500}
.kpi-sub.positive{color:#10b981}
.kpi-sub.negative{color:#ef4444}
.kpi-sub.neutral{color:var(--text-muted)}
.progress-track{width:100%;height:6px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width 0.6s ease}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.grid-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:16px}
/* === HAMBURGER MENU === */
.hamburger{display:none;background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--text-primary);padding:4px 8px;border-radius:6px;line-height:1}
.hamburger:hover{background:rgba(255,255,255,0.06)}
.mobile-menu-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;opacity:0;transition:opacity 0.3s}
.mobile-menu-overlay.open{display:block;opacity:1}
.mobile-menu{position:fixed;top:0;right:0;width:280px;max-width:85vw;height:100vh;background:var(--bg-secondary);border-left:1px solid var(--border);z-index:201;transform:translateX(100%);transition:transform 0.3s ease;display:flex;flex-direction:column;overflow-y:auto}
.mobile-menu.open{transform:translateX(0)}
.mobile-menu-header{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.mobile-menu-header h3{font-size:0.88rem;font-weight:700;color:var(--text-primary)}
.mobile-menu-close{background:none;border:none;color:var(--text-muted);font-size:1.3rem;cursor:pointer;padding:4px 8px}
.mobile-menu-close:hover{color:var(--text-primary)}
.mobile-menu nav{padding:12px 0;flex:1}
.mobile-menu nav button{display:flex;align-items:center;gap:10px;width:100%;padding:14px 20px;background:none;border:none;color:var(--text-secondary);font-size:0.82rem;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;text-align:left;border-left:3px solid transparent;transition:all 0.2s;-webkit-tap-highlight-color:rgba(139,92,246,0.2);touch-action:manipulation;position:relative;z-index:1}
.mobile-menu nav button:hover,.mobile-menu nav button:active{color:var(--text-primary);background:rgba(255,255,255,0.08)}
.mobile-menu nav button.active{color:var(--text-primary);background:rgba(255,255,255,0.06);border-left-color:var(--accent-purple);font-weight:700}

/* === RESPONSIVE — TABLET (1024px) === */
@media(max-width:1024px){
  .content{padding:20px 24px}
  .topbar{padding:12px 24px}
  .tab-bar{padding:0 24px}
  .pinboard{padding:16px 24px}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .grid-4{grid-template-columns:1fr 1fr}
}

/* === RESPONSIVE — MOBILE (768px) === */
@media(max-width:768px){
  .hamburger{display:block}
  .tab-bar{display:none}
  .topbar{padding:10px 16px}
  .topbar h1{font-size:1.05rem}
  .topbar-sub{font-size:0.68rem;display:none}
  .topbar-right{gap:10px;font-size:0.7rem}
  .content{padding:14px 16px 32px;max-width:100%}
  .pinboard{padding:14px 16px;min-height:auto}
  .pinboard-title{font-size:0.62rem;margin-bottom:10px}
  .pin-grid{gap:10px}
  .pin-card{min-width:140px;max-width:100%;flex:1 1 140px;min-height:90px;padding:10px}
  .pin-card.pin-wide{min-width:100%;max-width:100%}
  .pin-card-title{font-size:0.58rem}
  .pin-card-value{font-size:1.1rem}
  .pin-card-sub{font-size:0.65rem}
  .pin-add-btn{width:140px;min-height:90px}
  .grid-2,.grid-3,.grid-4,.kpi-grid{grid-template-columns:1fr}
  .card{border-radius:10px;padding:14px}
  .section-title{font-size:0.92rem;margin-bottom:10px}
  .section-subtitle{font-size:0.75rem}
  .kpi-card{padding:12px 10px}
  .kpi-value{font-size:1.15rem}
  .kpi-label{font-size:0.62rem}
  .alert-box{padding:12px 14px;font-size:0.78rem;border-radius:10px}
  .data-table{font-size:0.72rem;min-width:600px}
  .data-table th{padding:8px 10px;font-size:0.62rem}
  .data-table td{padding:7px 10px}
  .card{overflow-x:auto}
  .badge{font-size:0.65rem;padding:2px 8px}
  .filter-btn{padding:5px 10px;font-size:0.68rem}
  .pinnable-wrap .pin-hover-btn{opacity:0.85;font-size:0.58rem;padding:3px 8px}
  /* Hero KPIs stack */
  .hero-kpi-row{grid-template-columns:1fr !important}
  .kpi-grid-6{grid-template-columns:repeat(3,1fr) !important}
  /* Auth gate */
  .auth-card{width:92vw;padding:32px 24px}
  .auth-card h1{font-size:1.25rem}
  .auth-card input{padding:12px 14px;font-size:0.85rem}
  .auth-card .auth-btn{padding:12px;font-size:0.82rem}
}

/* === RESPONSIVE — SMALL PHONES (400px) === */
@media(max-width:400px){
  .topbar h1{font-size:0.92rem}
  .topbar-right{font-size:0.65rem;gap:6px}
  .content{padding:10px 12px 24px}
  .pinboard{padding:10px 12px}
  .pin-card{min-width:100%;padding:8px}
  .pin-card-value{font-size:1rem}
  .pin-add-btn{width:100%;min-height:70px}
  .kpi-value{font-size:1rem}
  .kpi-grid-6{grid-template-columns:repeat(2,1fr) !important}
  .section-title{font-size:0.85rem}
  .alert-box{font-size:0.72rem;padding:10px 12px}
  .auth-card{padding:24px 18px}
  .auth-card h1{font-size:1.1rem}
  .auth-card .auth-sub{font-size:0.7rem}
}

/* === PRINT === */
@media print{.topbar,.tab-bar,.pinboard,.hamburger,.mobile-menu,.mobile-menu-overlay,.pin-hover-btn{display:none !important}.content{padding:10px}}
.pinboard{min-height:380px;padding:20px 32px;background:radial-gradient(circle,rgba(255,255,255,0.03) 1px,transparent 1px);background-size:24px 24px;background-color:rgba(10,14,26,0.95);border-bottom:1px solid var(--border);position:relative;transition:box-shadow 0.5s ease,border-color 0.5s ease}
.pinboard-title{font-size:0.7rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);margin-bottom:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.pin-grid{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.pin-card{min-width:180px;max-width:420px;min-height:120px;padding:14px;background:var(--bg-card);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:12px;position:relative;transition:all 0.3s ease}
.pin-card.pin-wide{min-width:340px;max-width:480px}
.pinnable-wrap{position:relative}
.pinnable-wrap .pin-hover-btn{position:absolute;top:8px;right:8px;z-index:10;opacity:0;transition:opacity 0.2s;background:rgba(139,92,246,0.85);border:none;color:#fff;font-size:0.65rem;font-weight:600;padding:4px 10px;border-radius:6px;cursor:pointer;font-family:'Inter',sans-serif;display:flex;align-items:center;gap:4px;backdrop-filter:blur(6px);letter-spacing:0.3px;text-transform:uppercase}
.pinnable-wrap:hover .pin-hover-btn{opacity:1}
.pinnable-wrap .pin-hover-btn:hover{background:rgba(139,92,246,1);transform:scale(1.05)}
.pinnable-wrap .pin-hover-btn.pinned{background:rgba(16,185,129,0.85)}
.pinnable-wrap .pin-hover-btn.pinned:hover{background:rgba(239,68,68,0.85)}
.pin-card:hover{border-color:var(--border-bright);box-shadow:0 4px 20px rgba(0,0,0,0.3)}
.pin-card-accent{position:absolute;top:0;left:0;right:0;height:2px;border-radius:12px 12px 0 0}
.pin-card-title{font-size:0.62rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin-top:6px;margin-bottom:8px;font-weight:600}
.pin-card-value{font-size:1.35rem;font-weight:700;color:var(--text-primary);line-height:1.2}
.pin-card-sub{font-size:0.7rem;color:var(--text-secondary);margin-top:4px}
.pin-close{position:absolute;top:6px;right:8px;background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:0.85rem;padding:2px 6px;border-radius:4px;transition:all 0.2s}
.pin-close:hover{color:var(--text-primary);background:rgba(255,255,255,0.1)}
.pin-add-btn{width:200px;min-height:130px;padding:14px;background:rgba(255,255,255,0.02);border:1px dashed rgba(255,255,255,0.1);border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:all 0.3s;color:var(--text-muted);font-family:'Inter',sans-serif}
.pin-add-btn:hover{background:rgba(255,255,255,0.04);border-color:rgba(255,255,255,0.2);color:var(--text-secondary)}
.pin-add-btn span{font-size:1.5rem;font-weight:300}
.pin-add-btn small{font-size:0.68rem;text-transform:uppercase;letter-spacing:1px}
.pin-dropdown{position:absolute;bottom:100%;left:0;margin-bottom:4px;background:var(--bg-secondary);border:1px solid var(--border-bright);border-radius:10px;padding:6px;min-width:220px;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,0.5)}
.pin-dropdown button{display:block;width:100%;text-align:left;padding:8px 12px;background:none;border:none;color:var(--text-secondary);font-size:0.78rem;cursor:pointer;border-radius:6px;font-family:'Inter',sans-serif;transition:all 0.15s}
.pin-dropdown button:hover{background:rgba(255,255,255,0.06);color:var(--text-primary)}
.filter-btn{padding:6px 14px;border-radius:20px;font-size:0.75rem;font-weight:500;border:1px solid var(--border);background:transparent;color:var(--text-secondary);cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s}
.filter-btn:hover{border-color:var(--border-bright);color:var(--text-primary)}
.filter-btn.active{background:rgba(59,130,246,0.15);color:#3b82f6;border-color:rgba(59,130,246,0.3)}
.upload-zone{border:2px dashed rgba(255,255,255,0.1);border-radius:14px;padding:40px;text-align:center;margin-bottom:20px;background:rgba(255,255,255,0.02);transition:all 0.3s;cursor:pointer}
.upload-zone:hover{border-color:rgba(255,255,255,0.2);background:rgba(255,255,255,0.03)}
.chip{display:inline-flex;align-items:center;padding:4px 12px;border-radius:16px;font-size:0.72rem;font-weight:500;cursor:pointer;transition:all 0.2s;border:1px solid transparent;margin:3px}
#auth-gate{position:fixed;top:0;left:0;right:0;bottom:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:var(--bg-primary)}
#auth-gate::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 20% 0%,rgba(59,130,246,0.08) 0%,transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(139,92,246,0.06) 0%,transparent 60%),radial-gradient(ellipse at 50% 50%,rgba(6,182,212,0.03) 0%,transparent 70%);pointer-events:none}
#auth-gate.hidden{opacity:0;pointer-events:none;transition:opacity 0.5s ease}
.auth-card{position:relative;z-index:1;background:var(--bg-card);backdrop-filter:blur(16px);border:1px solid var(--border-bright);border-radius:20px;padding:48px 40px;width:380px;max-width:90vw;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.auth-card h1{font-size:1.5rem;font-weight:800;letter-spacing:-0.5px;background:linear-gradient(135deg,#ffffff,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.auth-card .auth-sub{font-size:0.78rem;color:var(--text-muted);margin-bottom:32px;font-weight:400}
.auth-card .auth-label{font-size:0.68rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-muted);font-weight:600;margin-bottom:10px;text-align:left}
.auth-card input{width:100%;padding:14px 18px;background:rgba(255,255,255,0.04);border:1px solid var(--border-bright);border-radius:12px;color:var(--text-primary);font-size:0.92rem;font-family:'Inter',sans-serif;outline:none;transition:all 0.3s;letter-spacing:1px}
.auth-card input:focus{border-color:rgba(139,92,246,0.5);box-shadow:0 0 20px rgba(139,92,246,0.1)}
.auth-card input.error{border-color:rgba(239,68,68,0.6);box-shadow:0 0 20px rgba(239,68,68,0.1)}
.auth-card .auth-btn{width:100%;padding:14px;background:linear-gradient(135deg,#8b5cf6,#3b82f6);border:none;border-radius:12px;color:#fff;font-size:0.88rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;margin-top:16px;transition:all 0.3s;letter-spacing:0.3px}
.auth-card .auth-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(139,92,246,0.3)}
.auth-card .auth-error{font-size:0.75rem;color:#ef4444;margin-top:12px;min-height:20px;transition:opacity 0.2s}
.auth-card .auth-brand{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:24px}
.auth-card .auth-icon{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#8b5cf6,#3b82f6);display:flex;align-items:center;justify-content:center;font-size:1.2rem}
@keyframes authShake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.auth-card.shake{animation:authShake 0.4s ease}
.auth-forgot{background:none;border:none;color:var(--text-muted);font-size:0.75rem;font-family:'Inter',sans-serif;cursor:pointer;margin-top:16px;transition:color 0.2s;letter-spacing:0.2px}
.auth-forgot:hover{color:var(--text-secondary)}
.auth-hint{font-size:0.78rem;color:var(--text-secondary);margin-top:12px;padding:14px 18px;background:rgba(139,92,246,0.06);border:1px solid rgba(139,92,246,0.15);border-radius:10px;text-align:left;line-height:1.6;display:none}
.auth-hint.visible{display:block}
.auth-hint strong{color:var(--accent-purple);font-weight:600}

function loadLS(key, fallback) {
  try { var v = localStorage.getItem('di_'+key); return v !== null ? JSON.parse(v) : fallback; } catch(e) { return fallback; }
}
function saveLS(key, val) {
  try { localStorage.setItem('di_'+key, JSON.stringify(val)); } catch(e) {}

// Cloud sync: save all slider state to Netlify function, debounced
var _cloudSaveTimer = null;
function cloudSaveDebounced() {
  if (_cloudSaveTimer) clearTimeout(_cloudSaveTimer);
  _cloudSaveTimer = setTimeout(function() {
    var allState = {};
    var keys = ['resolutions','sliderLocks','pipProgress','pipLocked','guestyPct','guestyLocked','completionPct','clientSatisfaction','delivResolutions','aiResolutions','renoItems','finInvestment','finTargetADR','finTargetRevenue'];
    keys.forEach(function(k) {
      try { var v = localStorage.getItem('di_'+k); if (v !== null) allState[k] = JSON.parse(v); } catch(e) {}
    });
    // Also collect completion slider states (cs_ prefix)
    for (var i = 0; i < localStorage.length; i++) {
      var lk = localStorage.key(i);
      if (lk && lk.indexOf('di_cs_') === 0) {
        try { allState[lk.replace('di_','')] = JSON.parse(localStorage.getItem(lk)); } catch(e) {}

      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(allState)

  }, 1500);
}

function cloudLoad() {
  return fetch('/.netlify/functions/slider-state')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data && typeof data === 'object') {
        Object.keys(data).forEach(function(k) {
          if (k.indexOf('cs_') === 0) {
            localStorage.setItem('di_'+k, JSON.stringify(data[k]));
          } else {
            localStorage.setItem('di_'+k, JSON.stringify(data[k]));
          }
        });
      }
      return data;
    })
    .catch(function() { return null; });
}

const fmt = n => {
  if(n===undefined||n===null) return '-';
  if(typeof n==='string') return n;
  const abs = Math.abs(n);
  const s = abs>=1000 ? '$'+abs.toLocaleString() : '$'+abs;
  return n<0 ? '-'+s : s;
};
const fmtK = n => {
  if(n===undefined) return '-';
  const abs = Math.abs(n);
  if(abs>=1000) return (n<0?'-':'')+'$'+(abs/1000).toFixed(0)+'K';
  return fmt(n);
};
const pct = n => (typeof n==='number' ? n.toFixed(1)+'%' : n);

function Badge({status}) {
  const cls = 'badge badge-'+(status||'pending');
  const labels = {complete:'Complete','in-progress':'In Progress',pending:'Pending',critical:'Critical',high:'High',medium:'Medium','not-started':'Not Started',current:'Current'};
  return React.createElement('span',{className:cls},labels[status]||status);
}

  const h = height||6;

  return React.createElement('div',{className:'progress-track',style:{height:h}},
    React.createElement('div',{className:'progress-fill',style:{width:value+'%',background:grad,height:h}})
  );
}

}

function RingChart({value,size,color,strokeWidth}) {
  const sz = size||60, sw = strokeWidth||5, r = (sz-sw)/2, circ = 2*Math.PI*r;
  const off = circ - (value/100)*circ;
  return React.createElement('svg',{width:sz,height:sz,style:{transform:'rotate(-90deg)'}},
    React.createElement('circle',{cx:sz/2,cy:sz/2,r:r,fill:'none',stroke:'rgba(255,255,255,0.06)',strokeWidth:sw}),
    React.createElement('circle',{cx:sz/2,cy:sz/2,r:r,fill:'none',stroke:color||'#06b6d4',strokeWidth:sw,strokeDasharray:circ,strokeDashoffset:off,strokeLinecap:'round',style:{transition:'stroke-dashoffset 0.8s ease'}})
  );
}

function MiniDonut({value,size,color}) {
  const sz = size||50, sw = 4, r = (sz-sw)/2, circ = 2*Math.PI*r;
  const off = circ-(value/100)*circ;
  return React.createElement('svg',{width:sz,height:sz,style:{transform:'rotate(-90deg)'}},
    React.createElement('circle',{cx:sz/2,cy:sz/2,r:r,fill:'none',stroke:'rgba(255,255,255,0.06)',strokeWidth:sw}),
    React.createElement('circle',{cx:sz/2,cy:sz/2,r:r,fill:'none',stroke:color,strokeWidth:sw,strokeDasharray:circ,strokeDashoffset:off,strokeLinecap:'round'})
  );
}

function Pinnable({id, title, accent, wide, children}) {
  const {pins, addPin, removePin, isItemPinned} = useContext(PinContext);
  const pinned = isItemPinned(id);
  const [hoverUnpin, setHoverUnpin] = useState(false);
  const wrapRef = useRef(null);

  const handleClick = () => {
    if(pinned) {
      removePin(id);
    } else {
      addPin({id:id, type:'component', title:title||id, accent:accent||'#8b5cf6', wide:!!wide, renderKey:id});
    }
  };

  return React.createElement('div',{className:'pinnable-wrap',ref:wrapRef},
    React.createElement('button',{
      className:'pin-hover-btn'+(pinned?' pinned':''),
      onClick:handleClick,
      onMouseEnter:()=>setHoverUnpin(true),
      onMouseLeave:()=>setHoverUnpin(false)

function parseDuration(val) {
  if (!val) return 0;
  var s = String(val).trim();
  if (s.indexOf(':') !== -1) {
    var parts = s.split(':');
    return (parseInt(parts[0]) || 0) + (parseInt(parts[1]) || 0) / 60;
  }
  var n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function fmtDuration(hrs) {
  if (!hrs) return '0:00';
  var h = Math.floor(hrs);
  var m = Math.round((hrs - h) * 60);
  if (m === 60) { h++; m = 0; }
  return h + ':' + (m < 10 ? '0' : '') + m;
}
function fmtCurrency(n) {
  return '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}
